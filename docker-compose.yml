services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taqneeq
      POSTGRES_PASSWORD: taqneeq
      POSTGRES_DB: taqneeq
    ports:
      # Host port 5434, not 5432 - avoids clashing with a locally installed
      # Postgres service. Change freely; just keep DATABASE_URL in sync.
      - "5434:5432"
    volumes:
      - taqneeq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taqneeq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taqneeq_pgdata:
